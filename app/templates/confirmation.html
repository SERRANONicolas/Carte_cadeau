{% extends "base.html" %}
{% block title %}Demande enregistrée{% endblock %}
{% block content %}
<div class="confirm-page christmas-bg {{ hero_bg_class }}" style="{{ hero_bg_style }}">
  <div class="confirm-card">
    <div class="icon">🎁</div>

  </div>
</div>
{% endblock %}
